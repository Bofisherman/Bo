{% extends "base.html" %}
{% block title %}Login - BO Fisherman{% endblock %}

{% block content %}
<div
  class="min-h-screen flex items-center justify-center bg-slate-50 py-12 px-4 sm:px-6 lg:px-8 relative overflow-hidden">

  <!-- Background -->
  <div class="absolute inset-0 z-0">
    <img src="{{ url_for('static', filename='images/home1.jpg') }}" alt="Fishing Background"
      class="w-full h-full object-cover opacity-20">
    <div class="absolute inset-0 bg-gradient-to-tr from-slate-900/40 to-slate-900/20"></div>
  </div>

  <!-- Card -->
  <div
    class="max-w-md w-full space-y-8 bg-white p-10 rounded-3xl shadow-2xl relative z-10 backdrop-blur-sm bg-white/90">
    <div class="text-center">
      <img class="mx-auto h-12 w-auto" src="{{ url_for('static', filename='images/logo.png') }}" alt="BO Fisherman">
      <h2 class="mt-6 text-3xl font-heading font-bold text-slate-900">Welcome Back</h2>
      <p class="mt-2 text-sm text-slate-600">
        Sign in to access your courses and profile
      </p>
    </div>

    <form class="mt-8 space-y-6" method="POST" action="{{ url_for('main.login') }}">
      <div class="rounded-md shadow-sm -space-y-px">
        <div>
          <label for="email-address" class="sr-only">Email address</label>
          <input id="email-address" name="email" type="email" autocomplete="email" required
            class="appearance-none rounded-none relative block w-full px-4 py-3 border border-slate-300 placeholder-slate-500 text-slate-900 rounded-t-xl focus:outline-none focus:ring-brand-500 focus:border-brand-500 focus:z-10 sm:text-sm"
            placeholder="Email address">
        </div>
        <div>
          <label for="password" class="sr-only">Password</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required
            class="appearance-none rounded-none relative block w-full px-4 py-3 border border-slate-300 placeholder-slate-500 text-slate-900 rounded-b-xl focus:outline-none focus:ring-brand-500 focus:border-brand-500 focus:z-10 sm:text-sm"
            placeholder="Password">
        </div>
      </div>

      <div>
        <button type="submit"
          class="group relative w-full flex justify-center py-3 px-4 border border-transparent text-sm font-medium rounded-full text-white bg-brand-700 hover:bg-brand-800 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-brand-500 transition-colors shadow-lg">
          Sign in
        </button>
      </div>
    </form>

    <div class="relative my-6">
      <div class="absolute inset-0 flex items-center">
        <div class="w-full border-t border-slate-200"></div>
      </div>
      <div class="relative flex justify-center text-sm">
        <span class="px-2 bg-white text-slate-500">Or continue with</span>
      </div>
    </div>

    <div class="grid grid-cols-2 gap-3">
      <a href="{{ url_for('google.login') }}"
        class="w-full flex items-center justify-center px-4 py-2 border border-slate-300 shadow-sm text-sm font-medium rounded-lg text-slate-700 bg-white hover:bg-slate-50 transition-colors">
        <img class="h-5 w-5 mr-2" src="{{ url_for('static', filename='images/google-icon.png') }}" alt="Google">
        Google
      </a>
      <a href="{{ url_for('main.apple_login') }}"
        class="w-full flex items-center justify-center px-4 py-2 border border-slate-300 shadow-sm text-sm font-medium rounded-lg text-slate-700 bg-white hover:bg-slate-50 transition-colors">
        <img class="h-5 w-5 mr-2" src="{{ url_for('static', filename='images/apple-icon.png') }}" alt="Apple">
        Apple
      </a>
    </div>

    <div class="text-center mt-4">
      <p class="text-sm text-slate-600">
        New to BO Fisherman?
        <a href="{{ url_for('main.register') }}" class="font-medium text-brand-600 hover:text-brand-500">Create an
          account</a>
      </p>
    </div>
  </div>
</div>
{% endblock %}
